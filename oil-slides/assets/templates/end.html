<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><link rel="stylesheet" href="../runtime/deck.css"><style>
/* OIL-SLIDE-CSS:START */
.s-__ID__ .mark{width:68px;height:7px;border-radius:99px;background:var(--accent-mark);margin:0 0 40px}.s-__ID__ h1{margin:0;color:var(--ink);font-weight:780;letter-spacing:-.04em}.s-__ID__ .note{margin:0;color:var(--ink-2);font-size:30px;line-height:1.55}.s-__ID__ .meta{margin-top:40px;color:var(--ink-3);font:600 24px/1.4 var(--font-ui);letter-spacing:.04em}
/* line: one sharp sentence */
.s-__ID__[data-variant="line"] .end{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}.s-__ID__[data-variant="line"] h1{width:1500px;height:320px;font-size:108px;line-height:1.12}.s-__ID__[data-variant="line"] .side,.s-__ID__[data-variant="line"] .artifact{display:none}
/* line-note: sentence + aside */
.s-__ID__[data-variant="line-note"] .end{position:absolute;inset:0;display:grid;grid-template-columns:1.35fr .65fr;gap:64px;align-items:end;padding-bottom:20px}.s-__ID__[data-variant="line-note"] h1{width:980px;height:300px;font-size:92px;line-height:1.14}.s-__ID__[data-variant="line-note"] .meta{display:none}.s-__ID__[data-variant="line-note"] .artifact{display:none}.s-__ID__[data-variant="line-note"] .side{position:relative;padding:10px 0 10px 36px}.s-__ID__[data-variant="line-note"] .side::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;background:var(--border);border-radius:99px}.s-__ID__[data-variant="line-note"] .side .label{display:block;margin:0 0 14px;color:var(--ink-3);font:700 18px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase}.s-__ID__[data-variant="line-note"] .side .note{width:420px;height:160px;font-size:30px}
/* line-artifact: sentence + real object card */
.s-__ID__[data-variant="line-artifact"] .end{position:absolute;inset:0;display:grid;grid-template-columns:1.25fr .75fr;gap:72px;align-items:center}.s-__ID__[data-variant="line-artifact"] h1{width:920px;height:260px;font-size:86px;line-height:1.14}.s-__ID__[data-variant="line-artifact"] .meta{display:none}.s-__ID__[data-variant="line-artifact"] .side{display:none}.s-__ID__[data-variant="line-artifact"] .lead{margin-top:28px;width:780px;height:100px;color:var(--ink-2);font-size:28px;line-height:1.55}.s-__ID__[data-variant="line-artifact"] .artifact{justify-self:end;width:420px;padding:36px;border-radius:calc(var(--surface-radius) + 4px);background:#fff;border:1px solid var(--border);text-align:center}.s-__ID__[data-variant="line-artifact"] .artifact img{width:260px;height:260px;object-fit:cover;border-radius:12px;display:block;margin:0 auto 22px;background:var(--surface)}.s-__ID__[data-variant="line-artifact"] .artifact .cap-title{margin:0 0 6px;color:var(--ink);font:700 26px/1.3 var(--font-zh)}.s-__ID__[data-variant="line-artifact"] .artifact .cap-body{margin:0;color:var(--ink-2);font-size:24px;line-height:1.45}.s-__ID__[data-variant="line"] .lead,.s-__ID__[data-variant="line-note"] .lead{display:none}
/* OIL-SLIDE-CSS:END */</style></head><body data-oil-mode="preview"><div class="slide-preview-viewport"><div class="slide-preview-shell"><div class="slide-preview-stage">
<!-- OIL-SLIDE:START -->
<section class="oil-slide s-__ID__" data-slide-id="__ID__" data-title="__TITLE__" data-variant="__VARIANT__" data-component-decor="__DECOR__" data-bg="clean-halo"><div class="slide-safe" data-layout-check="minimal"><div class="end" data-layout data-bound><div class="main"><div class="mark" aria-hidden="true"></div><h1 data-fit data-min-size="68" data-max-chars="20">__TITLE__</h1><p class="lead" data-slot="note" data-sentence data-fit data-min-size="24" data-max-chars="32"></p><p class="meta" data-slot="meta" data-small-ok data-max-chars="18"></p></div><aside class="side"><span class="label" data-slot="aside-label" data-max-chars="10"></span><p class="note" data-slot="aside" data-sentence data-fit data-min-size="24" data-max-chars="28"></p></aside><div class="artifact oil-surface" data-tone="neutral"><!-- OIL-VISUAL:main:START --><!-- OIL-VISUAL:main:END --><p class="cap-title" data-slot="artifact-title" data-small-ok data-max-chars="12"></p><p class="cap-body" data-slot="artifact-body" data-small-ok data-sentence data-fit data-min-size="20" data-max-chars="18"></p></div></div></div></section>
<!-- OIL-SLIDE:END -->
</div></div></div><script src="../runtime/deck.js"></script></body></html>
