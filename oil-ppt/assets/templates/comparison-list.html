<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><link rel="stylesheet" href="../runtime/deck.css"><style>
/* OIL-SLIDE-CSS:START */
.s-__ID__ .wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.s-__ID__ h1{width:1500px;height:150px;margin:16px 0 34px;color:var(--ink);font-size:82px;line-height:1.18;letter-spacing:-.025em}
.s-__ID__ .compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;height:666px}
.s-__ID__ .side{position:relative;min-width:0;padding:34px;display:grid;grid-template-rows:92px 1fr;overflow:visible;border:0}
.s-__ID__ .head{display:flex;align-items:center}
.s-__ID__ h2{height:64px;margin:0;color:var(--ink-2);font-size:50px;line-height:1.15;letter-spacing:-.02em}
.s-__ID__ .focus h2{color:var(--ink)}
.s-__ID__ .rows{display:grid;grid-template-rows:repeat(3,1fr);gap:14px}
.s-__ID__ .row{display:grid;grid-template-columns:60px 1fr;gap:20px;align-items:center;padding:0 18px;border-radius:20px;background:rgba(255,255,255,.7)}
.s-__ID__ .mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--ink) 7%,#fff);color:var(--ink-3);font:800 18px/1 var(--font-ui)}
.s-__ID__ .focus .mark{background:color-mix(in srgb,var(--accent) 18%,#fff);color:var(--ink)}
.s-__ID__ .row p{height:92px;margin:0;display:flex;align-items:center;color:var(--ink-2);font-size:30px;line-height:1.5}
.s-__ID__ .focus .row:first-child{background:rgba(255,255,255,.88)}
.s-__ID__ .focus .row:first-child p{color:var(--ink);font-weight:650}
.s-__ID__[data-variant="focus-left"] .side:first-child{grid-column:2;grid-row:1}
.s-__ID__[data-variant="focus-left"] .focus{grid-column:1;grid-row:1}
.s-__ID__[data-variant="balanced"] .focus{background:var(--surface)}
.s-__ID__[data-variant="balanced"] .focus::before{opacity:.12}
.s-__ID__[data-variant="balanced"] .focus h2{color:var(--ink-2)}
.s-__ID__[data-variant="balanced"] .focus .mark{background:color-mix(in srgb,var(--ink) 7%,#fff);color:var(--ink-3)}
.s-__ID__[data-variant="balanced"] .focus .row:first-child{background:rgba(255,255,255,.7)}
.s-__ID__[data-variant="balanced"] .focus .row:first-child p{color:var(--ink-2);font-weight:400}
/* OIL-SLIDE-CSS:END */</style></head><body data-oil-mode="preview"><div class="slide-preview-viewport"><div class="slide-preview-shell"><div class="slide-preview-stage">
<!-- OIL-SLIDE:START -->
<section class="oil-slide s-__ID__" data-slide-id="__ID__" data-title="__TITLE__" data-variant="__VARIANT__" data-component-decor="__DECOR__" data-bg="grid-fade"><div class="slide-safe" data-layout-check="full"><div class="wrap"><h1 data-fit data-min-size="62" data-max-chars="22">__TITLE__</h1><!-- OIL-VISUAL:main:START --><div class="compare" data-layout><article class="side oil-surface" data-tone="soft" data-overlap-group="compare"><div class="head"><h2 data-fit data-min-size="38" data-max-chars="10"></h2></div><div class="rows"><div class="row" data-visual-node="left-1"><span class="mark">01</span><p data-sentence data-fit data-min-size="32" data-max-chars="24"></p></div><div class="row" data-visual-node="left-2"><span class="mark">02</span><p data-sentence data-fit data-min-size="32" data-max-chars="24"></p></div><div class="row" data-visual-node="left-3"><span class="mark">03</span><p data-sentence data-fit data-min-size="32" data-max-chars="24"></p></div></div></article><article class="side focus oil-surface" data-tone="accent" data-decor="__DECOR__" data-decor-size="lg" data-overlap-group="compare"><div class="head"><h2 data-fit data-min-size="38" data-max-chars="10"></h2></div><div class="rows"><div class="row" data-visual-node="right-1"><span class="mark">01</span><p data-sentence data-fit data-min-size="32" data-max-chars="24"></p></div><div class="row" data-visual-node="right-2"><span class="mark">02</span><p data-sentence data-fit data-min-size="32" data-max-chars="24"></p></div><div class="row" data-visual-node="right-3"><span class="mark">03</span><p data-sentence data-fit data-min-size="32" data-max-chars="24"></p></div></div></article></div><!-- OIL-VISUAL:main:END --></div></div></section>
<!-- OIL-SLIDE:END -->
</div></div></div><script src="../runtime/deck.js"></script></body></html>
