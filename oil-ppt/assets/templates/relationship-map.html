<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><link rel="stylesheet" href="../runtime/deck.css"><style>
/* OIL-SLIDE-CSS:START */
.s-__ID__ .wrap{position:absolute;inset:0;display:flex;flex-direction:column;overflow:visible}
.s-__ID__ .intro{height:190px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(360px,.6fr);gap:64px;align-items:end;overflow:visible}
.s-__ID__ .title-block::before{content:"";display:block;width:42px;height:8px;margin:0 0 22px;border-radius:999px;background:var(--accent)}
.s-__ID__ h1{height:136px;margin:0;font-size:62px;line-height:1.08;letter-spacing:-.045em}
.s-__ID__ .lead{height:92px;margin:0 0 4px;color:var(--ink-2);font-size:24px;line-height:1.58}
.s-__ID__ .relationship-canvas{position:relative;height:718px;margin-top:20px;overflow:visible}
.s-__ID__ .relationship-links{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;max-width:none;max-height:none;overflow:visible;pointer-events:none}
.s-__ID__ .relationship-link{fill:none;stroke:color-mix(in srgb,var(--ink) 24%,var(--border));stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.s-__ID__ .relationship-arrow{fill:color-mix(in srgb,var(--ink) 24%,var(--border))}
.s-__ID__ .relationship-label rect{fill:var(--bg);stroke:color-mix(in srgb,var(--ink) 12%,var(--border));stroke-width:2}
.s-__ID__ .relationship-label text{fill:var(--ink-2);font:700 17px/1 var(--font-ui);letter-spacing:.02em;text-anchor:middle;dominant-baseline:middle}
.s-__ID__ .relationship-nodes{position:absolute;inset:0;z-index:2;overflow:visible}
.s-__ID__ .relationship-nodes>*{position:absolute;width:352px;height:212px;padding:26px 30px;transform:translate(-50%,-50%);overflow:visible;border:0;border-radius:var(--surface-radius-sm);box-shadow:none}
.s-__ID__ [data-node-position="center"]{left:50%;top:50%}
.s-__ID__ [data-peripheral-count="3"] [data-node-position="1"]{left:18%;top:19%}
.s-__ID__ [data-peripheral-count="3"] [data-node-position="2"]{left:82%;top:19%}
.s-__ID__ [data-peripheral-count="3"] [data-node-position="3"]{left:50%;top:82%}
.s-__ID__ [data-peripheral-count="4"] [data-node-position="1"]{left:16%;top:18%}
.s-__ID__ [data-peripheral-count="4"] [data-node-position="2"]{left:84%;top:18%}
.s-__ID__ [data-peripheral-count="4"] [data-node-position="3"]{left:84%;top:80%}
.s-__ID__ [data-peripheral-count="4"] [data-node-position="4"]{left:16%;top:80%}
.s-__ID__ [data-peripheral-count="5"] [data-node-position="1"]{left:50%;top:11%}
.s-__ID__ [data-peripheral-count="5"] [data-node-position="2"]{left:84%;top:31%}
.s-__ID__ [data-peripheral-count="5"] [data-node-position="3"]{left:72%;top:82%}
.s-__ID__ [data-peripheral-count="5"] [data-node-position="4"]{left:28%;top:82%}
.s-__ID__ [data-peripheral-count="5"] [data-node-position="5"]{left:16%;top:31%}
.s-__ID__ .relationship-nodes .node-index{display:block;margin-bottom:10px;color:var(--ink-3);font:800 16px/1 var(--font-ui);letter-spacing:.1em}
.s-__ID__ .relationship-nodes h2{min-height:34px;margin:0;font-size:30px;line-height:1.16;letter-spacing:-.03em}
.s-__ID__ .relationship-nodes p{min-height:54px;margin:10px 0 0;color:var(--ink-2);font-size:20px;line-height:1.48}
.s-__ID__ .relationship-nodes>:first-child,.s-__ID__ .relationship-nodes>[data-node-role="center"]{width:410px;height:212px;padding:38px 42px;text-align:center;background:var(--accent-soft)}
.s-__ID__ .relationship-nodes>:first-child .node-index,.s-__ID__ .relationship-nodes>[data-node-role="center"] .node-index{color:color-mix(in srgb,var(--accent) 58%,var(--ink))}
.s-__ID__ .relationship-nodes>:first-child h2,.s-__ID__ .relationship-nodes>[data-node-role="center"] h2{font-size:38px}
.s-__ID__ .relationship-nodes>:first-child p,.s-__ID__ .relationship-nodes>[data-node-role="center"] p{font-size:21px}
/* OIL-SLIDE-CSS:END */</style></head><body data-oil-mode="preview"><div class="slide-preview-viewport"><div class="slide-preview-shell"><div class="slide-preview-stage">

</div></div></div><script src="../runtime/deck.js"></script></body></html>
