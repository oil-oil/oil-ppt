<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><link rel="stylesheet" href="../runtime/deck.css"><style>
/* OIL-SLIDE-CSS:START */
.s-__ID__ .wrap{position:absolute;inset:0;display:grid;grid-template-columns:8fr 4fr;grid-template-rows:204px 1fr;column-gap:24px;row-gap:26px}.s-__ID__ .head{grid-column:1/-1;display:grid;grid-template-columns:8fr 4fr;gap:26px;align-items:end}.s-__ID__ h1{height:164px;margin:20px 0 0;font-size:76px;line-height:1.08;letter-spacing:-.045em}.s-__ID__ .lead{height:104px;margin:0;color:var(--ink-2);font-size:29px;line-height:1.55}.s-__ID__ .main{min-height:0}.s-__ID__ .evidence{height:100%;border:1px solid var(--border);border-radius:var(--surface-radius);background:#fff}.s-__ID__ .evidence img{display:block;width:100%;height:100%;object-fit:contain}.s-__ID__ .chart-panel{height:100%;padding:32px 38px}.s-__ID__ .chart-panel h2{margin:0;font-size:30px}.s-__ID__ .chart-panel .oil-chart-bars{height:520px;margin-top:58px}.s-__ID__[data-variant="evidence"] .chart-panel{display:none}.s-__ID__[data-variant="chart"] .evidence{display:none}.s-__ID__ .side{min-height:0;display:grid;grid-template-rows:1fr 1fr 1.38fr;gap:18px}.s-__ID__ .metric{padding:28px;display:flex;flex-direction:column;justify-content:space-between}.s-__ID__ .metric span{font-size:23px;font-weight:700}.s-__ID__ .metric strong{font-size:58px;letter-spacing:-.05em}.s-__ID__ .insight{padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between}.s-__ID__ .insight h2{height:36px;margin:0 0 8px;font-size:27px}.s-__ID__ .insight p{height:82px;margin:0;color:rgba(255,255,255,.72);font-size:23px;line-height:1.5}
/* Evidence stays dominant; the side rail is a quiet set of colored facts. */
.s-__ID__ .wrap{grid-template-columns:8.15fr 3.85fr;column-gap:20px}
.s-__ID__ .head{grid-template-columns:8.15fr 3.85fr;gap:34px}
.s-__ID__ .evidence{padding:22px;border:0;border-radius:46px;background:color-mix(in srgb,var(--surface) 76%,var(--accent-soft))}
.s-__ID__ .evidence img{border-radius:28px;background:rgba(255,255,255,.72)}
.s-__ID__ .chart-panel{position:relative;overflow:visible;border:0;border-radius:46px;background:color-mix(in srgb,var(--accent-soft) 78%,var(--accent-fill))}
.s-__ID__ .chart-panel h2,.s-__ID__ .chart-panel .oil-chart-bars{position:relative;z-index:1}
.s-__ID__ .side{gap:14px}
.s-__ID__ .metric,.s-__ID__ .insight{border:0;border-radius:34px}
.s-__ID__ .metric:nth-child(1){background:color-mix(in srgb,var(--accent-soft) 88%,#fff)}
.s-__ID__ .metric:nth-child(2){background:color-mix(in srgb,var(--surface) 88%,#fff)}
.s-__ID__ .metric::after{content:none}
.s-__ID__ .insight{color:var(--ink);background:color-mix(in srgb,var(--accent-soft) 72%,var(--accent-fill))}
.s-__ID__ .insight .oil-icon-frame{background:rgba(255,255,255,.68);color:color-mix(in srgb,var(--accent) 62%,var(--ink))}
.s-__ID__ .insight h2{color:var(--ink)}
.s-__ID__ .insight p{color:var(--ink-2)}
/* OIL-SLIDE-CSS:END */</style></head><body data-oil-mode="preview"><div class="slide-preview-viewport"><div class="slide-preview-shell"><div class="slide-preview-stage">
