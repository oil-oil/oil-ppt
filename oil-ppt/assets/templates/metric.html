<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><link rel="stylesheet" href="../runtime/deck.css"><style>
/* OIL-SLIDE-CSS:START */
.s-__ID__ .layout{position:absolute;inset:0;align-items:center}
.s-__ID__ .copy{--oil-copy-title-max:250px;--oil-copy-body-max:132px;position:relative;grid-column:1 / span 5;min-width:0;padding-right:34px}
.s-__ID__ h1{width:100%;margin:28px 0 22px;font-size:84px;line-height:1.18;letter-spacing:-.03em}
.s-__ID__ .note{width:100%;margin:0;color:var(--ink-2);font-size:32px;line-height:1.6}
.s-__ID__ .metric{grid-column:6 / span 7;height:712px;padding:70px 68px 64px;display:flex;flex-direction:column;justify-content:center;overflow:visible;border:0;background:var(--surface)}
.s-__ID__ .measure{display:flex;align-items:flex-end;min-width:0}
.s-__ID__ .value{min-width:0;color:var(--ink);font:820 222px/1.2 var(--font-ui);letter-spacing:-.075em}
.s-__ID__ .unit{margin:0 0 12px 18px;color:color-mix(in srgb,var(--accent) 58%,var(--ink));font:760 48px/1.25 var(--font-ui)}
.s-__ID__ .caption{position:relative;max-width:680px;margin-top:72px;padding:6px 0 6px 42px;border-radius:0;background:transparent;color:var(--ink-2);font:620 32px/1.5 var(--font-ui)}
.s-__ID__ .caption::before{content:"";position:absolute;left:0;top:17px;width:18px;height:18px;border-radius:6px;background:color-mix(in srgb,var(--accent) 64%,var(--ink))}
.s-__ID__ .metric-detail{display:none;min-width:0}
.s-__ID__[data-variant="delta"] h1,.s-__ID__[data-variant="progress"] h1{font-size:72px}
.s-__ID__[data-variant="delta"] .value,.s-__ID__[data-variant="progress"] .value{font-size:188px}
.s-__ID__[data-variant="delta"] .caption,.s-__ID__[data-variant="progress"] .caption{margin-top:32px;font-size:28px}
.s-__ID__[data-variant="delta"] .delta-detail{display:flex;align-items:baseline;gap:18px;margin-top:18px}
.s-__ID__ .delta-change{color:color-mix(in srgb,var(--accent) 64%,var(--ink));font:820 48px/1.15 var(--font-ui);letter-spacing:-.03em}
.s-__ID__ .delta-label{color:var(--ink-2);font:700 22px/1.35 var(--font-ui)}
.s-__ID__[data-variant="progress"] .progress-detail{display:block;margin-top:20px}
.s-__ID__ .progress-meta{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:18px;color:var(--ink-2);font:700 20px/1.3 var(--font-ui)}
.s-__ID__ .progress-target::before{content:"目标 ";color:var(--ink-3);font-weight:620}
.s-__ID__ .progress-track[data-clip="shape"]{display:block;width:100%;height:22px;max-width:none;max-height:none;overflow:hidden;border-radius:999px}
.s-__ID__ .progress-track .progress-rail{fill:color-mix(in srgb,var(--ink) 8%,transparent)}
.s-__ID__ .progress-track .progress-fill{fill:var(--accent)}
/* OIL-SLIDE-CSS:END */</style></head><body data-oil-mode="preview"><div class="slide-preview-viewport"><div class="slide-preview-shell"><div class="slide-preview-stage">
<!-- OIL-SLIDE:START -->
<section class="oil-slide s-__ID__" data-slide-id="__ID__" data-title="__TITLE__" data-variant="__VARIANT__" data-component-decor="__DECOR__" data-bg="grid-fade"><div class="slide-safe" data-layout-check="full"><div class="layout oil-grid"><div class="copy" data-copy-flow data-layout data-overlap-group="main"><h1 data-copy-title data-fit data-min-size="60" data-max-chars="22">__TITLE__</h1><p class="note" data-copy-body data-sentence data-fit data-min-size="32" data-max-chars="36"></p></div><div class="metric oil-surface" data-tone="soft" data-decor="__DECOR__" data-decor-size="lg" data-layout data-bound data-overlap-group="main"><div class="measure"><span class="value" data-fit data-min-size="92" data-max-chars="12"></span><span class="unit" data-fit data-min-size="28" data-max-chars="8"></span></div><div class="metric-detail delta-detail"><strong class="delta-change" data-slot="metric-change" data-fit data-min-size="34"></strong><span class="delta-label" data-slot="metric-change-label" data-fit data-min-size="18"></span></div><div class="metric-detail progress-detail"><div class="progress-meta"><span class="progress-label" data-slot="metric-progress-label" data-small-ok></span><span class="progress-target" data-slot="metric-target" data-small-ok></span></div><svg class="progress-track" data-clip="shape" viewBox="0 0 100 1" preserveAspectRatio="none" aria-hidden="true"><rect class="progress-rail" x="0" y="0" width="100" height="1" rx=".5"></rect><rect class="progress-fill" data-progress-fill x="0" y="0" width="0" height="1" rx=".5"></rect></svg></div><div class="caption" data-sentence data-fit data-min-size="24" data-max-chars="36"></div></div></div></div></section>
<!-- OIL-SLIDE:END -->
</div></div></div><script src="../runtime/deck.js"></script></body></html>
