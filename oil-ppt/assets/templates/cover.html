<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><link rel="stylesheet" href="../runtime/deck.css"><style>
/* OIL-SLIDE-CSS:START */
.s-__ID__ .kicker{display:flex;align-items:center;gap:16px;margin:0 0 40px;color:var(--ink-3);font:650 22px/1 var(--font-ui);letter-spacing:.16em;text-transform:uppercase}.s-__ID__ .kicker i{display:block;width:48px;height:4px;border-radius:99px;background:var(--accent-mark)}.s-__ID__ h1{margin:0;color:var(--ink);font-weight:780;letter-spacing:-.045em}.s-__ID__ .note{margin:28px 0 0;color:var(--ink-2);font-size:30px;line-height:1.55;font-weight:500}.s-__ID__ .rule{margin-top:52px;width:148px;height:12px;border-radius:99px;background:var(--accent-mark);opacity:.72}

.s-__ID__[data-variant="statement"] .cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 12px;z-index:1}.s-__ID__[data-variant="statement"] .copy{--oil-copy-title-max:360px;--oil-copy-body-max:80px}.s-__ID__[data-variant="statement"] h1{width:1580px;font-size:96px;line-height:1.14;letter-spacing:-.04em}.s-__ID__[data-variant="statement"] .note{width:920px}.s-__ID__[data-variant="statement"] .media{display:none}

/* OIL-SLIDE-CSS:END */</style></head><body data-oil-mode="preview"><div class="slide-preview-viewport"><div class="slide-preview-shell"><div class="slide-preview-stage">
