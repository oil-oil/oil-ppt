<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><link rel="stylesheet" href="../runtime/deck.css"><style>
/* OIL-SLIDE-CSS:START */
.s-__ID__ .wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.s-__ID__ h1{width:1480px;height:140px;margin:18px 0 28px;font-size:78px;line-height:1.18;letter-spacing:-.025em}
.s-__ID__ .steps{position:relative;height:700px;padding:28px 0 24px;display:grid;grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr) 82px minmax(0,1fr);align-items:stretch}
.s-__ID__ .step{position:relative;z-index:2;min-width:0;padding:40px 36px 34px;display:grid;grid-template-rows:118px 82px 1fr;align-content:center;overflow:visible;border:0;background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--ink) 2%,#fff))}
.s-__ID__ .step::before{opacity:.16}
.s-__ID__ .n{display:grid;place-items:center;align-self:start;width:94px;height:94px;border-radius:26px;background:rgba(255,255,255,.76);color:var(--ink-2);font:780 54px/1 var(--font-ui);letter-spacing:-.055em}
.s-__ID__ h2{height:64px;margin:0;color:var(--ink);font-size:44px;line-height:1.18}
.s-__ID__ p{height:170px;margin:24px 0 0;color:var(--ink-2);font-size:32px;line-height:1.55}
.s-__ID__ .connector{position:relative;z-index:3;display:grid;place-items:center;align-self:center;height:82px;user-select:none}
.s-__ID__ .connector::before{content:none}
.s-__ID__ .connector .oil-icon-frame{--icon-frame:62px;--icon-size:34px;--icon-radius:20px;background:var(--surface);color:var(--ink-2)}
.s-__ID__ .connector .oil-icon{opacity:1}
.s-__ID__[data-variant="linear"] .step:first-child,.s-__ID__[data-variant="focus-middle"] .step.focus{background:linear-gradient(145deg,color-mix(in srgb,var(--accent-soft) 92%,#fff),#fff)}
.s-__ID__[data-variant="linear"] .step:first-child .n,.s-__ID__[data-variant="focus-middle"] .step.focus .n{background:color-mix(in srgb,var(--accent) 17%,#fff);color:var(--ink)}
.s-__ID__[data-variant="linear"] .step.focus{background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--ink) 2%,#fff))}
.s-__ID__[data-variant="linear"] .step.focus .n{background:rgba(255,255,255,.76);color:var(--ink-2)}
.s-__ID__[data-variant="linear"] .step.focus::after,.s-__ID__[data-variant="focus-middle"] .step:first-child::after{content:none!important;display:none!important}
/* OIL-SLIDE-CSS:END */</style></head><body data-oil-mode="preview"><div class="slide-preview-viewport"><div class="slide-preview-shell"><div class="slide-preview-stage">
<!-- OIL-SLIDE:START -->
<section class="oil-slide s-__ID__" data-slide-id="__ID__" data-title="__TITLE__" data-variant="__VARIANT__" data-component-decor="__DECOR__" data-bg="grid-wide"><div class="slide-safe" data-layout-check="full"><div class="wrap"><h1 data-fit data-min-size="62" data-max-chars="22">__TITLE__</h1><!-- OIL-VISUAL:main:START --><div class="steps" data-layout><article class="step oil-surface" data-tone="soft" data-decor="__DECOR__" data-visual-node="step-1" data-step="1"><div class="n">01</div><h2 data-fit data-min-size="38" data-max-chars="8"></h2><p data-sentence data-fit data-min-size="32" data-max-chars="22"></p></article><div class="connector" data-c="12" aria-hidden="true"><span class="oil-icon-frame" data-kind="connector" data-slot="connector">→</span></div><article class="step focus oil-surface" data-tone="soft" data-decor="__DECOR__" data-visual-node="step-2" data-step="2"><div class="n">02</div><h2 data-fit data-min-size="38" data-max-chars="8"></h2><p data-sentence data-fit data-min-size="32" data-max-chars="22"></p></article><div class="connector" data-c="23" aria-hidden="true"><span class="oil-icon-frame" data-kind="connector" data-slot="connector">→</span></div><article class="step oil-surface" data-tone="soft" data-visual-node="step-3" data-step="3"><div class="n">03</div><h2 data-fit data-min-size="38" data-max-chars="8"></h2><p data-sentence data-fit data-min-size="32" data-max-chars="22"></p></article></div><!-- OIL-VISUAL:main:END --></div></div></section>
<!-- OIL-SLIDE:END -->
</div></div></div><script src="../runtime/deck.js"></script></body></html>
