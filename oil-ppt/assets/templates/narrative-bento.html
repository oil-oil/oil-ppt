<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><link rel="stylesheet" href="../runtime/deck.css"><style>
/* OIL-SLIDE-CSS:START */
.s-__ID__ .wrap{position:absolute;inset:0;display:grid;grid-template-columns:8fr 4fr;grid-template-rows:204px 1fr;column-gap:32px;row-gap:26px}.s-__ID__ .head{align-self:end}.s-__ID__ h1{height:164px;margin:20px 0 0;font-size:76px;line-height:1.08;letter-spacing:-.045em}.s-__ID__ .lead{align-self:end;height:104px;margin:0;color:var(--ink-2);font-size:29px;line-height:1.55}.s-__ID__ .bento{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:1.25fr .75fr .75fr;grid-template-rows:1fr 1fr;gap:18px}.s-__ID__ .main{grid-row:1/3;padding:36px 40px;display:flex;flex-direction:column;justify-content:space-between}.s-__ID__ .statement{height:250px;margin:0;font-size:58px;line-height:1.12;letter-spacing:-.04em}.s-__ID__ .statement-body{height:108px;margin:0;color:rgba(255,255,255,.72);font-size:26px;line-height:1.55}.s-__ID__ .card{padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between}.s-__ID__ .card h2{height:40px;margin:18px 0 8px;font-size:31px;line-height:1.2}.s-__ID__ .card p{height:64px;margin:0;color:var(--ink-2);font-size:22px;line-height:1.48}.s-__ID__ .quote{grid-column:2/4;padding:26px 34px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}.s-__ID__ .quote blockquote{height:94px;margin:0;font-size:31px;line-height:1.45;font-weight:700}
/* Bento hierarchy is carried by scale and gentle color, not a dominant black slab. */
.s-__ID__ .bento{grid-template-columns:1.3fr .7fr .7fr;gap:16px}
.s-__ID__ .main,.s-__ID__ .card,.s-__ID__ .quote{border:0;border-radius:42px}
.s-__ID__ .main{color:var(--ink);background:color-mix(in srgb,var(--accent-soft) 64%,var(--accent-fill))}
.s-__ID__ .main .oil-icon-frame{background:rgba(255,255,255,.66);color:color-mix(in srgb,var(--accent) 64%,var(--ink))}
.s-__ID__ .main .statement{color:var(--ink)}
.s-__ID__ .main .statement-body{color:var(--ink-2)}
.s-__ID__ .card:nth-of-type(2){background:color-mix(in srgb,var(--surface) 88%,#fff)}
.s-__ID__ .card:nth-of-type(3){background:color-mix(in srgb,var(--accent-soft) 58%,#fff)}
.s-__ID__ .card .oil-icon-frame,.s-__ID__ .quote .oil-icon-frame{background:rgba(255,255,255,.68)}
.s-__ID__ .quote{background:color-mix(in srgb,var(--surface) 72%,var(--accent-soft))}
.s-__ID__ .quote::after{content:none;display:none}
/* OIL-SLIDE-CSS:END */</style></head><body data-oil-mode="preview"><div class="slide-preview-viewport"><div class="slide-preview-shell"><div class="slide-preview-stage">

</div></div></div><script src="../runtime/deck.js"></script></body></html>
