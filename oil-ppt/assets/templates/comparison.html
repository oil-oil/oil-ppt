<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><link rel="stylesheet" href="../runtime/deck.css"><style>
/* OIL-SLIDE-CSS:START */
.s-__ID__ .wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.s-__ID__ .intro{display:none}
.s-__ID__ h1{width:1500px;height:160px;margin:24px 0 34px;font-size:82px;line-height:1.18;letter-spacing:-.025em}
.s-__ID__ .compare{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);gap:0;height:650px}
.s-__ID__ .compare::before,.s-__ID__ .compare::after{content:none!important}
.s-__ID__ .compare-spacer{position:relative;z-index:6;display:grid;place-items:center;align-self:stretch;min-width:0}
.s-__ID__ .compare-arrow{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--ink);color:var(--slide-bg);font:650 28px/1 var(--font-ui);transform:none}
.s-__ID__ .compare-arrow::before{content:"↔";display:block;transform:translateY(-1px)}
.s-__ID__ .side{position:relative;min-width:0;height:650px;padding:46px 46px 42px;display:grid;grid-template-rows:auto 1fr;overflow:visible;border:0}
.s-__ID__ .head{position:relative;z-index:2;display:grid;grid-template-columns:64px 1fr;gap:18px;align-items:start}
.s-__ID__ .index{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--ink) 7%,#fff);color:var(--ink-3);font:760 18px/1 var(--font-ui);letter-spacing:.08em}
.s-__ID__ .focus .index{background:color-mix(in srgb,var(--accent) 16%,#fff);color:var(--ink)}
.s-__ID__ h2{height:82px;margin:0;color:var(--ink-2);font-size:50px;line-height:1.2}
.s-__ID__ .focus h2{color:var(--ink)}
.s-__ID__ .points{position:relative;z-index:2;display:grid;align-content:center;gap:18px;padding:18px 0 0}
.s-__ID__ .point{position:relative;min-height:118px;margin:0;padding:30px 28px 28px 74px;border-radius:22px;background:rgba(255,255,255,.68);color:var(--ink-2);font-size:32px;line-height:1.5}
.s-__ID__ .point::before{content:"";position:absolute;left:28px;top:34px;width:20px;height:20px;border-radius:7px;background:color-mix(in srgb,var(--ink) 12%,var(--surface))}
.s-__ID__ .focus .point::before{background:color-mix(in srgb,var(--accent) 64%,var(--ink))}
.s-__ID__ .side.focus .point:first-child{color:var(--ink);font-weight:650}
.s-__ID__ .evidence-content{display:none}
.s-__ID__[data-variant="visual-evidence"] .intro{display:grid;grid-template-columns:minmax(0,1fr) 590px;align-items:end;gap:40px;margin:34px 0 30px}
.s-__ID__[data-variant="visual-evidence"] .intro h1{width:auto;height:88px;margin:0;font-size:70px;line-height:1.08;letter-spacing:-.045em}
.s-__ID__[data-variant="visual-evidence"] .intro p{height:58px;margin:0;color:var(--ink-2);font-size:22px;line-height:1.48;text-align:right}
.s-__ID__[data-variant="visual-evidence"]>.slide-safe>.wrap>h1{display:none}
.s-__ID__[data-variant="visual-evidence"] .compare{grid-template-columns:minmax(0,1fr) 98px minmax(0,1fr);height:706px}
.s-__ID__[data-variant="visual-evidence"] .compare-arrow{width:68px;height:68px;border-radius:22px;font-size:34px}
.s-__ID__[data-variant="visual-evidence"] .compare-arrow::before{content:"→"}
.s-__ID__[data-variant="visual-evidence"] .side{height:706px;padding:32px;border-radius:var(--surface-radius);display:block;background:linear-gradient(145deg,var(--surface),rgba(255,255,255,.94))}
.s-__ID__[data-variant="visual-evidence"] .side.focus{background:linear-gradient(145deg,color-mix(in srgb,var(--accent-soft) 82%,#fff),rgba(255,255,255,.96))}
.s-__ID__[data-variant="visual-evidence"] .head,.s-__ID__[data-variant="visual-evidence"] .points{display:none}
.s-__ID__[data-variant="visual-evidence"] .evidence-content{display:block}
.s-__ID__[data-variant="visual-evidence"] .evidence-content h2{height:42px;margin:0;color:var(--ink);font-size:34px;line-height:1.18}
.s-__ID__[data-variant="visual-evidence"] .side-lead{height:28px;margin:14px 0 22px;color:var(--ink);font:760 22px/1.25 var(--font-ui)}
.s-__ID__[data-variant="visual-evidence"] .evidence-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:394px}
.s-__ID__[data-variant="visual-evidence"] figure{position:relative;margin:0;overflow:hidden;border-radius:var(--surface-radius-sm);background:var(--surface)}
.s-__ID__[data-variant="visual-evidence"] figure .oil-media,.s-__ID__[data-variant="visual-evidence"] figure img{display:block;width:100%;height:100%;object-fit:cover}
.s-__ID__[data-variant="visual-evidence"] figcaption{position:absolute;left:14px;right:14px;bottom:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.93);color:var(--ink);font:720 16px/1.3 var(--font-zh)}
.s-__ID__[data-variant="visual-evidence"] .findings{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.s-__ID__[data-variant="visual-evidence"] .finding{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.72)}
.s-__ID__[data-variant="visual-evidence"] .finding b{display:block;margin-bottom:5px;color:var(--ink);font-size:19px}
.s-__ID__[data-variant="visual-evidence"] .finding p{height:51px;margin:0;color:var(--ink-2);font-size:17px;line-height:1.45}
.s-__ID__[data-variant="visual-evidence"] figcaption:empty,.s-__ID__[data-variant="visual-evidence"] .side-lead:empty{display:none}.s-__ID__[data-variant="visual-evidence"] .side-lead:empty+.evidence-pair{margin-top:18px}
.s-__ID__[data-variant="visual-evidence"] .oil-media[data-media-fit="contain"]>img{object-fit:contain}
/* OIL-SLIDE-CSS:END */</style></head><body data-oil-mode="preview"><div class="slide-preview-viewport"><div class="slide-preview-shell"><div class="slide-preview-stage">
